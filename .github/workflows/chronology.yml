name: Generate Chronology and Lists

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"          # only runs when markdown files change
      - ".github/workflows/chronology.yml"
      - "generate_chronology.py"
      - "generate_lists.py"

  workflow_dispatch:     # lets you trigger it manually from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write    # needed to push CHRONOLOGY.md back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate CHRONOLOGY.md
        env:
          VAULT_ROOT: "."
        run: python generate_chronology.py

      - name: Generate office lists
        env:
          VAULT_ROOT: "."
        run: python generate_lists.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHRONOLOGY.md chronology.json
          git add -A -- Lists '*Titles/*.md'
          # only commit if there's actually a diff
          git diff --cached --quiet || git commit -m "chore: update CHRONOLOGY.md and Lists [skip ci]"
          git push
